<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom Russia · Регистрация</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(180deg, #16161e, #0f0f15);
            border: 1px solid #2a2a3a;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        h2 {
            margin: 0 0 8px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 7px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #333;
            border-radius: 12px;
            background: #0a0a0a;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #7c3aed;
        }
        button {
            width: 100%;
            margin-top: 8px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #7c3aed, #4f46e5);
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: filter 0.2s;
        }
        button:hover { filter: brightness(1.1); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #status {
            margin-top: 16px;
            font-size: 14px;
            min-height: 20px;
            text-align: center;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎮 Bloom Russia</h2>
        <p class="subtitle">Регистрация на сервере Сочи</p>

        <form id="regForm">
            <div class="input-group">
                <label>Никнейм (3–24 символа)</label>
                <input type="text" id="nick" maxlength="24" placeholder="Sasha_Yokato" required>
            </div>
            <div class="input-group">
                <label>Почта</label>
                <input type="email" id="mail" placeholder="you@mail.ru" required>
            </div>
            <div class="input-group">
                <label>Пароль (6–32 символа)</label>
                <input type="password" id="pass" maxlength="32" required>
            </div>
            <button type="submit">Отправить заявку</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        const form = document.getElementById('regForm');
        const nickInput = document.getElementById('nick');
        const mailInput = document.getElementById('mail');
        const passInput = document.getElementById('pass');
        const submitBtn = form.querySelector('button');
        const statusDiv = document.getElementById('status');

        function showStatus(text, type) {
            statusDiv.textContent = text;
            statusDiv.className = type;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nick = nickInput.value.trim();
            const mail = mailInput.value.trim();
            const pass = passInput.value;

            if (!/^[A-Za-z0-9_]{3,24}$/.test(nick)) {
                showStatus('Неверный никнейм', 'error');
                return;
            }
            if (!/^\S+@\S+\.\S+$/.test(mail) || mail.length > 61) {
                showStatus('Неверная почта', 'error');
                return;
            }
            if (pass.length < 6 || pass.length > 32) {
                showStatus('Неверный пароль', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Отправка...';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nick, mail, pass })
                });
                const data = await response.json();
                if (data.ok) {
                    showStatus('Заявка отправлена администратору ✅', 'success');
                    form.reset();
                    setTimeout(() => { statusDiv.textContent = ''; }, 5000);
                } else {
                    showStatus(data.error || 'Ошибка сервера', 'error');
                }
            } catch (err) {
                showStatus('Ошибка сети', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Отправить заявку';
            }
        });
    </script>
</body>
</html>
